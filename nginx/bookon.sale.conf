# Active on server as /etc/nginx/conf.d/bookon.conf

# Link-preview bots don't run JavaScript: they get a small page with og: tags
map $http_user_agent $bookon_link_bot {
    default 0;
    "~*(TelegramBot|facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|Slackbot|Discordbot|vkShare|SkypeUriPreview)" 1;
}

server {
    server_name bookon.sale www.bookon.sale;

    client_max_body_size 30M;

    # Admin panel images (backend src/public/img); other /img/* belong to the React app
    location ~ ^/img/(book-icon\.svg|books-logo\.webp|default\.jpeg|favicon\.png|library\.jpg|upload\.svg)$ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
    }

    # API, admin panel (SSR) and uploaded files -> backend (3005)
    location ~ ^/(member|product|order|article|og|admin|uploads|css|js)(/|$) {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io -> backend (websocket upgrade)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React build files have a content hash in their name: cache them for a year
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # A news article: bots get the backend share page, people get the React app
    location ~ ^/news/[^/]+/?$ {
        if ($bookon_link_bot) {
            rewrite ^/news/([^/]+)/?$ /og/news/$1 last;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # Everything else -> React app (3000). index.html must be revalidated on
    # every visit, otherwise browsers keep loading an old release after a deploy.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bookon.sale/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bookon.sale/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.bookon.sale) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = bookon.sale) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name bookon.sale www.bookon.sale;
    return 404; # managed by Certbot




}