services:
  bookon-api:
    container_name: bookon-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3005
    ports:
     - "3005:3005"
    volumes:
      - bookon_uploads:/app/uploads
    networks:
      - bookon-network

networks:
  bookon-network:
    driver: bridge

volumes:
  bookon_uploads:

