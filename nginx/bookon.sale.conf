# Active on server as /etc/nginx/conf.d/bookon.conf
server {
    server_name bookon.sale www.bookon.sale;

    client_max_body_size 30M;

    # Admin panel images (backend src/public/img); other /img/* belong to the React app
    location ~ ^/img/(book-icon\.svg|books-logo\.webp|default\.jpeg|favicon\.png|library\.jpg|upload\.svg)$ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
    }

    # API, admin panel (SSR) and uploaded files -> backend (3005)
    location ~ ^/(member|product|order|admin|uploads|css|js)(/|$) {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io -> backend (websocket upgrade)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> React app (3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bookon.sale/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bookon.sale/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.bookon.sale) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = bookon.sale) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name bookon.sale www.bookon.sale;
    return 404; # managed by Certbot




}